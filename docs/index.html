<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Бюджет">
  <title>Бюджет</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
    <h1 id="monthTitle">—</h1>
    <button class="icon-btn" id="nextMonth" aria-label="Следующий месяц">›</button>
  </header>

  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Добавить операцию">+</button>

  <nav class="tabbar">
    <button data-tab="overview" class="active"><span>◎</span>Обзор</button>
    <button data-tab="tx"><span>☰</span>Операции</button>
    <button data-tab="fixed"><span>↻</span>Постоянные</button>
    <button data-tab="forecast"><span>↗</span>Прогноз</button>
    <button data-tab="settings"><span>⚙</span>Ещё</button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <form class="sheet" id="sheet" autocomplete="off"></form>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
